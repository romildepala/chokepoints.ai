<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
:root{--bg:#0e1116;--panel:#161b22;--ink:#e8edf4;--mut:#9aa6b4;--line:#2a313c;--accent:#54c3f1}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Spline Sans',system-ui,sans-serif;overflow:hidden}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
header{padding:11px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:linear-gradient(180deg,#11161d,#0e1116)}
header h1{font-family:'Fraunces',serif;font-size:19px;font-weight:600;margin:0;white-space:nowrap}
header .sub{color:var(--mut);font-size:12px;max-width:560px;line-height:1.35}
.spacer{flex:1}
#search{background:#0c1014;border:1px solid var(--line);color:var(--ink);border-radius:9px;padding:8px 12px;font:13px 'Spline Sans';width:220px;outline:none}
#search:focus{border-color:var(--accent)}
.btn{background:#1b222c;border:1px solid var(--line);color:var(--ink);border-radius:9px;padding:7px 11px;font:13px 'Spline Sans';cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:#fff}
#toolbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:8px 18px;border-bottom:1px solid var(--line);background:#11161d}
.tabs{display:flex;gap:4px;background:#0c1014;border:1px solid var(--line);border-radius:10px;padding:3px}
.tab{padding:6px 12px;border-radius:8px;font:600 12.5px 'Spline Sans';cursor:pointer;color:var(--mut)}
.tab.active{background:#23303f;color:#fff}
#toolbar select{background:#0c1014;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:6px 8px;font:12px 'Spline Sans';outline:none}
.depth{display:flex;gap:3px;background:#0c1014;border:1px solid var(--line);border-radius:8px;padding:3px}
.depth span{padding:5px 9px;border-radius:6px;font:600 11.5px 'Spline Sans';cursor:pointer;color:var(--mut)}
.depth span.on{background:#23303f;color:#fff}
.tgl{display:flex;align-items:center;gap:5px;font:12px 'Spline Sans';cursor:pointer;user-select:none}
.note{color:var(--mut);font-size:11px;margin-left:auto;max-width:560px;text-align:right}
#main{flex:1;position:relative;overflow:hidden}
svg{width:100%;height:100%;display:block;cursor:grab}svg.grabbing{cursor:grabbing}
.vizlayer{position:absolute;inset:0;width:100%;height:100%}
.link{fill:none;stroke:#39424f;stroke-width:1}
.link.hier{stroke:#222932;stroke-opacity:.45}
.link.cat{stroke:#6f7c8c;stroke-opacity:.55;stroke-width:1.5}
.link.leaf{stroke:#4a5563;stroke-opacity:.28;stroke-width:.9}
.link.hl{stroke-opacity:1;stroke-width:2.2;stroke:#54c3f1}
.node circle.core{stroke:#0e1116;stroke-width:1.2;cursor:pointer}
.node text{font:10.5px 'Spline Sans';fill:var(--ink);pointer-events:none;paint-order:stroke;stroke:#0e1116;stroke-width:3px;stroke-linejoin:round}
.node.anchor text{font-weight:700;font-size:13px}
.ring{fill:none;stroke:#ff4d57;stroke-width:2}
.dim{opacity:.1}

.stagelab{font:700 12px 'Spline Sans';letter-spacing:.4px}
#tip{position:absolute;pointer-events:none;background:rgba(10,14,20,.96);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:12px 'Spline Sans';color:var(--ink);z-index:20;display:none;max-width:260px;box-shadow:0 6px 24px rgba(0,0,0,.5)}
#tip b{color:#cfe8ff}
#legend{position:absolute;left:14px;bottom:14px;background:rgba(16,20,26,.9);border:1px solid var(--line);border-radius:12px;padding:11px 13px;max-width:250px;backdrop-filter:blur(6px);z-index:4;max-height:70%;overflow:auto}
#legend .lt{font:600 10.5px 'Spline Sans';letter-spacing:.6px;color:var(--mut);text-transform:uppercase;margin-bottom:7px}
#legend .row{display:flex;align-items:center;gap:8px;font-size:11.5px;padding:2px 0;cursor:pointer;color:#cfd6df}
#legend .row.off{opacity:.32}
#legend .sw{width:11px;height:11px;border-radius:3px;flex:none}
#legend .note{font-size:10px;color:var(--mut);margin-top:7px;line-height:1.4}
.gradbar{height:9px;border-radius:5px;margin:5px 0}
#panel{position:absolute;top:0;right:0;height:100%;width:380px;background:var(--panel);border-left:1px solid var(--line);transform:translateX(100%);transition:transform .25s;overflow-y:auto;padding:20px;z-index:6}
#panel.open{transform:none}
#panel h2{font-family:'Fraunces',serif;font-size:20px;margin:.1em 0 .15em}
#panel .lay{font:600 11px 'Spline Sans';letter-spacing:1px;text-transform:uppercase}
#panel .chip{display:inline-block;font:600 10.5px 'Spline Sans';padding:3px 8px;border-radius:20px;margin:2px 4px 2px 0}
#panel p{font-size:13px;line-height:1.5;color:#cdd5df}
#panel .sec{font:600 10.5px 'Spline Sans';letter-spacing:1px;text-transform:uppercase;color:var(--mut);margin:15px 0 6px;border-top:1px solid var(--line);padding-top:11px}
#panel .metrics{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:11px 0 2px}
#panel .metrics span{background:#0f141b;border:1px solid var(--line);border-radius:9px;padding:6px 9px;display:flex;flex-direction:column}
#panel .metrics b{font:600 14px 'Spline Sans Mono';color:#fff}
#panel .metrics i{font-style:normal;font-size:9.5px;letter-spacing:.4px;color:var(--mut);text-transform:uppercase;margin-top:2px}
#panel .dep{display:block;font-size:12.5px;padding:3px 7px;border-radius:7px;cursor:pointer;color:#dbe2ea}
#panel .dep:hover{background:#222a34}
#panel .ld{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;vertical-align:middle}
#panel .co{font-size:12px;padding:5px 7px;border-bottom:1px solid #1c222c}

#panel .co a{color:#7fb8e6;text-decoration:none}
#panel .co .m{color:var(--mut);font-size:10.5px}
#panel .close{position:absolute;top:13px;right:14px;cursor:pointer;color:var(--mut);font-size:20px}
.barwrap{margin-top:6px}
.bar{height:7px;border-radius:4px;display:inline-block}
.stk-conn{width:2px;height:28px;background:var(--line);margin:0 auto}
.stk-card{border:1px solid var(--line);border-radius:14px;background:var(--panel);overflow:hidden;transition:border-color .2s}
.stk-card:hover{border-color:color-mix(in srgb, var(--lc) 60%, transparent)}
.stk-head{padding:18px 22px 14px;display:flex;align-items:flex-start;gap:14px}
.stk-badge{flex:none;width:44px;height:44px;border-radius:11px;display:flex;align-items:center;justify-content:center;font:700 15px 'Spline Sans Mono';color:#fff;background:var(--lc)}
.stk-title{font-family:'Fraunces',serif;font-size:18px;font-weight:600;line-height:1.3}
.stk-lid{color:var(--mut);font:500 11px 'Spline Sans Mono';margin-top:2px}
.stk-desc{padding:0 22px 16px;font-size:13px;line-height:1.6;color:#c4ccda}
.stk-subs{padding:0 22px 18px}
.stk-subs-t{font:600 10px 'Spline Sans';letter-spacing:1px;text-transform:uppercase;color:var(--mut);margin-bottom:8px}
.stk-chips{display:flex;flex-wrap:wrap;gap:5px}
.stk-chip{font:500 12px 'Spline Sans';padding:5px 10px;border-radius:20px;background:color-mix(in srgb, var(--lc) 14%, transparent);color:color-mix(in srgb, var(--lc) 70%, #fff);border:1px solid color-mix(in srgb, var(--lc) 20%, transparent);cursor:pointer;transition:background .15s}
.stk-chip:hover{background:color-mix(in srgb, var(--lc) 28%, transparent)}
@media(max-width:820px){#panel{width:100%}header .sub{display:none}.stk-head{padding:14px 16px 10px;gap:10px}.stk-badge{width:38px;height:38px;font-size:13px}.stk-title{font-size:15px}.stk-desc{padding:0 16px 12px;font-size:12px}.stk-subs{padding:0 16px 14px}.stk-chip{font-size:11px;padding:4px 8px}}
#mob{display:none;flex-direction:column;position:fixed;inset:0;background:var(--bg);overflow:hidden}
@media(max-width:768px){#app{display:none!important}#mob{display:flex!important}}
.msc{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);will-change:transform;transition:transform .3s cubic-bezier(.32,.72,0,1),opacity .3s}
.msc.enter{transform:translateX(100%)}
.msc.active{transform:translateX(0);z-index:2}
.msc.exit{transform:translateX(-20%);opacity:.4;z-index:1;pointer-events:none}
.mbar{flex:none;display:flex;align-items:center;gap:10px;padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top));background:var(--bg);border-bottom:1px solid var(--line);min-height:52px;z-index:5}
.mbar-back{background:none;border:none;color:var(--ink);font-size:28px;padding:0 8px 0 0;cursor:pointer;line-height:1;-webkit-tap-highlight-color:transparent}
.mbar-title{flex:1;font-family:'Fraunces',serif;font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mbar-sub{color:var(--mut);font-size:11px;margin-top:1px}
.mbar-icon{background:none;border:1px solid var(--line);color:var(--mut);width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;-webkit-tap-highlight-color:transparent;flex:none}
.mbar-icon:active{background:var(--line)}
.mbody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain}
.mbody-pad{height:max(24px,env(safe-area-inset-bottom))}
.mstats{display:flex;gap:8px;padding:12px 16px;overflow-x:auto;flex:none;border-bottom:1px solid var(--line)}
.mstats::-webkit-scrollbar{display:none}
.mstat{flex:none;background:#1b222c;border:1px solid var(--line);border-radius:20px;padding:6px 12px;font:500 12px 'Spline Sans';color:var(--mut);white-space:nowrap}
.mstat b{color:var(--ink)}
.mlcard{margin:8px 16px;border:1px solid var(--line);border-radius:14px;background:var(--panel);overflow:hidden;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:border-color .15s,background .15s;border-left:4px solid var(--lc)}
.mlcard:active{border-color:var(--lc);background:#1a2029}
.mlcard-head{display:flex;align-items:center;gap:12px;padding:16px}
.mlcard-badge{flex:none;width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font:700 13px 'Spline Sans Mono';color:#fff;background:var(--lc)}
.mlcard-info{flex:1;min-width:0}
.mlcard-name{font:600 15px 'Spline Sans';line-height:1.3}
.mlcard-meta{display:flex;gap:10px;margin-top:4px;font:12px 'Spline Sans';color:var(--mut)}
.mlcard-meta b{color:var(--ink)}
.mlcard-chev{color:var(--mut);font-size:22px;padding-left:4px;flex:none}
.mchoke{width:7px;height:7px;border-radius:50%;background:#ff4d57;display:inline-block;margin-left:5px;vertical-align:middle}
.mlayer-hero{padding:20px 16px;border-bottom:1px solid var(--line)}
.mlayer-desc{font-size:14px;line-height:1.65;color:#c4ccda;margin-top:12px}
.msec-title{padding:16px 16px 8px;font:600 10px 'Spline Sans';letter-spacing:1px;text-transform:uppercase;color:var(--mut)}
.mseg{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid #1c222c;cursor:pointer;-webkit-tap-highlight-color:transparent}
.mseg:active{background:#1b222c}
.mseg-dot{flex:none;width:10px;height:10px;border-radius:3px;background:var(--lc)}
.mseg-info{flex:1;min-width:0}
.mseg-name{font:500 14px 'Spline Sans';line-height:1.3}
.mseg-sub{font:12px 'Spline Sans';color:var(--mut);margin-top:2px}
.mseg-right{display:flex;align-items:center;gap:8px;flex:none}
.mseg-score{font:600 11px 'Spline Sans Mono';padding:3px 8px;border-radius:12px;background:#1b222c}
.mseg-chev{color:var(--mut);font-size:18px}
.mnode-hero{padding:20px 16px;border-bottom:1px solid var(--line)}
.mnode-crumb{font:12px 'Spline Sans';color:var(--mut);margin-bottom:8px}
.mnode-crumb span{cursor:pointer;text-decoration:underline;text-decoration-color:var(--line);-webkit-tap-highlight-color:transparent}
.mnode-name{font-family:'Fraunces',serif;font-size:22px;font-weight:600;line-height:1.25;margin-bottom:8px}
.mnode-badges{display:flex;flex-wrap:wrap;gap:6px}
.mnode-chip{font:600 11px 'Spline Sans';padding:4px 10px;border-radius:20px;background:#1c2530;color:#cfe8ff}
.mnode-chip.crit{background:#3a1417;color:#ff8088;border:1px solid #ff4d57}
.mnode-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:16px}
.mnode-metric{background:#0f141b;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.mnode-metric b{display:block;font:600 15px 'Spline Sans Mono';color:#fff}
.mnode-metric i{font-style:normal;font-size:10px;letter-spacing:.3px;color:var(--mut);text-transform:uppercase;margin-top:3px;display:block}
.mnode-section{padding:0 16px}
.mnode-sec-title{font:600 10px 'Spline Sans';letter-spacing:1px;text-transform:uppercase;color:var(--mut);padding:14px 0 8px;border-top:1px solid var(--line)}
.mnode-angle{margin:0 16px;padding:14px;background:linear-gradient(135deg,#1c2530,#182030);border:1px solid var(--line);border-radius:12px;margin-top:4px}
.mnode-angle-label{font:600 10px 'Spline Sans';letter-spacing:1px;text-transform:uppercase;color:var(--mut);margin-bottom:4px}
.mnode-angle-val{font:600 15px 'Spline Sans';color:#fff}
.mnode-angle-note{font:12px 'Spline Sans';color:var(--mut);margin-top:2px}
.mnode-dep{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #1c222c;cursor:pointer;-webkit-tap-highlight-color:transparent}
.mnode-dep:active{opacity:.6}
.mnode-dep-dot{flex:none;width:8px;height:8px;border-radius:2px}
.mnode-dep-name{flex:1;font:13px 'Spline Sans'}
.mnode-dep-arrow{color:var(--mut);font-size:16px;flex:none}
.mnode-dep:last-child{border-bottom:none}
.msearch{position:absolute;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column;transform:translateY(-100%);transition:transform .3s cubic-bezier(.32,.72,0,1)}
.msearch.open{transform:translateY(0)}
.msearch-bar{display:flex;align-items:center;gap:10px;padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top));border-bottom:1px solid var(--line);flex:none}
.msearch-input{flex:1;background:#0c1014;border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:10px 14px;font:14px 'Spline Sans';outline:none;-webkit-appearance:none}

.msearch-cancel{background:none;border:none;color:var(--accent);font:600 14px 'Spline Sans';cursor:pointer;padding:8px;flex:none}
.msearch-body{flex:1;overflow-y:auto}
.msearch-group{padding:14px 16px 6px;font:600 10px 'Spline Sans';letter-spacing:1px;text-transform:uppercase;color:var(--mut)}
.msearch-item{display:flex;align-items:center;gap:12px;padding:12px 16px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.msearch-item:active{background:#1b222c}
.msearch-item-dot{flex:none;width:10px;height:10px;border-radius:3px}
.msearch-item-info{flex:1;min-width:0}
.msearch-item-name{font:14px 'Spline Sans';white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msearch-item-meta{font:12px 'Spline Sans';color:var(--mut);margin-top:1px}
.msearch-empty{padding:48px 16px;text-align:center;color:var(--mut);font-size:14px;line-height:1.6}
.msheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.5);z-index:25;opacity:0;pointer-events:none;transition:opacity .25s}
.msheet-bg.open{opacity:1;pointer-events:auto}
.msheet{position:absolute;bottom:0;left:0;right:0;background:var(--panel);border-radius:16px 16px 0 0;z-index:26;transform:translateY(100%);transition:transform .3s cubic-bezier(.32,.72,0,1);padding:0 16px 24px;padding-bottom:max(24px,env(safe-area-inset-bottom))}
.msheet.open{transform:translateY(0)}
.msheet-handle{width:36px;height:4px;border-radius:2px;background:#3a4250;margin:10px auto 16px}
.msheet-title{font:600 16px 'Spline Sans';margin-bottom:16px}
.mswitch{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line)}
.mswitch label{font:14px 'Spline Sans'}
.mswitch-track{position:relative;width:48px;height:28px;border-radius:14px;background:#3a4250;cursor:pointer;transition:background .2s;flex:none}
.mswitch-track.on{background:var(--accent)}
.mswitch-knob{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:11px;background:#fff;transition:transform .2s}
.mswitch-track.on .mswitch-knob{transform:translateX(20px)}
</style></head><body><div id="app">
<header>
  <h1>AI Compute Value Chain · Atlas</h1>
  <span class="sub">Canonical 580-node taxonomy with the full dependency web. Hover any node to trace it back to raw materials; drill with the depth control; click for the investment read.</span>
  <span class="spacer"></span>

  <button class="btn" id="fit">Fit</button><button class="btn" id="reset">Reset</button>

</div>

function desc(id){const s=new Set(),st=[id];while(st.length){const c=st.pop();(dn[c]||[]).forEach(p=>{if(!s.has(p)){s.add(p);st.push(p);}});}return s;}

function nFill(n){
  if(colorBy==="layer")return LAY[n.layer].color;

  if(colorBy==="score")return n.score?SC[n.score]:"#2c333d";
  if(colorBy==="vc")return VC[n.vc]||"#2c333d";
  if(colorBy==="mkt")return MKT[n.mkt]||"#2c333d";
  if(colorBy==="mat")return MAT[n.mat]||"#2c333d";
  if(colorBy==="ai")return AI[n.ai]||"#2c333d";

function nSize(n){

  return n.r;
}
function passDepth(n){return depth>=9? true : n.level<=depth;}
function visible(n){ if(off.has(n.layer))return false; if(!passDepth(n))return false; if(chokeOnly&&n.critLvl<2)return false; if(scoredOnly&&n.score==null)return false; return true; }
function applyLens(){

  [1,2,3,4,5].forEach(v=>g.append("text").attr("fill","#8b9099").attr("x",L-10).attr("y",y(v)+4).attr("text-anchor","end").style("font","11px 'Spline Sans'").text(v));

function renderTree(){const W2=main().clientWidth,H2=main().clientHeight,el=document.getElementById("tsvg");el.innerHTML="";

function renderWheel(){
  const host=main(),W2=host.clientWidth,H2=host.clientHeight;
  const s=d3.select("#wsvg").attr("viewBox",`0 0 ${W2} ${H2}`);s.selectAll("*").remove();
  const cx=W2/2,cy=H2/2,RMAX=Math.min(W2,H2)/2-26;
  const wrap=s.append("g");const g=wrap.append("g").attr("transform",`translate(${cx},${cy})`);
  const dep={};function D(L){if(dep[L]!=null)return dep[L];const u=(LU[L]||[]).filter(x=>LAY[x]);dep[L]=u.length?1+Math.max.apply(null,u.map(D)):0;return dep[L];}
  Object.keys(LAY).forEach(D);const maxD=Math.max.apply(null,Object.values(dep));dep["LX"]=maxD+1;
  const TAU=Math.PI*2,PI=Math.PI;
  const ANG={L0:[0,TAU],L3:[0,TAU],L6:[0,TAU],L7:[0,TAU],L8:[0,TAU],LX:[0,TAU],L5:[0,PI],L4:[0,PI],L1:[PI,TAU],L2:[PI,TAU]};
  const cnt={};N.forEach(n=>cnt[n.layer]=(cnt[n.layer]||0)+1);
  const depths=[...new Set(Object.values(dep))].sort((a,b)=>a-b);
  const wt={};depths.forEach(d=>{const ls=Object.keys(dep).filter(L=>dep[L]===d);wt[d]=Math.sqrt(Math.max.apply(null,ls.map(L=>cnt[L]||1)))+1.3;});
  const totW=depths.reduce((a,d)=>a+wt[d],0);let acc=0;const bandR={};depths.forEach(d=>{const r0=RMAX*acc/totW;acc+=wt[d];bandR[d]=[r0,RMAX*acc/totW];});

  const idk=id=>id.split(".").map(p=>p.replace("L","").padStart(3,"0")).join(".");
  const dots=[];
  Object.keys(byL).forEach(L=>{const reg=REG[L];const arr=byL[L].slice().sort((a,b)=>idk(a.id)<idk(b.id)?-1:1);

    let rows=Math.max(1,Math.round((rr1-rr0)/11));rows=Math.min(rows,Math.max(1,Math.ceil(arr.length/Math.max(3,(span*midR)/15))));rows=Math.max(1,rows);

  const ds=d3.scaleSqrt().domain([1,1500]).range([1.6,7]);

    g.append("text").attr("x",x).attr("y",y).attr("text-anchor","middle").attr("dy",".35em").style("font","700 11.5px 'Spline Sans'").attr("fill",LAY[L].color).style("paint-order","stroke").style("stroke","#0e1116").style("stroke-width","3.5px").style("pointer-events","none").text(L);});

    if(!hits.length){res.innerHTML='<div class="msearch-empty">No results for “'+esc(q)+'”</div>';return;}
    var grp={};hits.forEach(function(n){(grp[n.layer]=grp[n.layer]||[]).push(n);});
    var h="";DATA.layerOrder.forEach(function(lid){if(!grp[lid])return;h+='<div class="msearch-group">'+esc(LAY[lid].name)+'</div>';grp[lid].forEach(function(n){h+='<div class="msearch-item" data-sid="'+n.id+'"><div class="msearch-item-dot" style="background:'+LAY[n.layer].color+'"></div><div class="msearch-item-info"><div class="msearch-item-name">'+esc(n.name)+'</div><div class="msearch-item-meta">'+esc(n.id)+' · '+n.roll.toLocaleString()+' companies'+(n.score?' · score '+n.score+'/5':'')+'</div></div></div>';});});
    res.innerHTML=h;
    res.querySelectorAll(".msearch-item").forEach(function(el){el.onclick=function(){mCloseSearch();mOpenNode(el.dataset.sid);};});
  };
};
function mCloseSearch(){document.getElementById("msearch").classList.remove("open");var inp=document.getElementById("msinput");inp.value="";inp.blur();}
document.getElementById("mscancel").onclick=mCloseSearch;

document.getElementById("mfilt-btn").onclick=function(){
  document.getElementById("msheetbg").classList.add("open");
  document.getElementById("msheet").classList.add("open");
  document.getElementById("msheetbody").innerHTML='<div class="mswitch"><label>Chokepoints only</label><div class="mswitch-track'+(mChoke?' on':'')+'" id="msw-c"><div class="mswitch-knob"></div></div></div><div class="mswitch"><label>Scored only</label><div class="mswitch-track'+(mScored?' on':'')+'" id="msw-s"><div class="mswitch-knob"></div></div></div>';
  document.getElementById("msw-c").onclick=function(){mChoke=!mChoke;this.classList.toggle("on",mChoke);};
  document.getElementById("msw-s").onclick=function(){mScored=!mScored;this.classList.toggle("on",mScored);};
};
function mCloseFilters(){document.getElementById("msheetbg").classList.remove("open");document.getElementById("msheet").classList.remove("open");renderLayers();}
document.getElementById("msheetbg").onclick=mCloseFilters;

var stx=0,sty=0,swp=false,swpS=null,swpP=null;
mob.addEventListener("touchstart",function(e){
  if(!mStack.length)return;var t=e.touches[0];if(t.clientX>28)return;
  stx=t.clientX;sty=t.clientY;swp=true;
  swpS=mStack[mStack.length-1];swpP=mStack.length>1?mStack[mStack.length-2]:document.getElementById("mhome");
},{passive:true});
mob.addEventListener("touchmove",function(e){
  if(!swp||!swpS)return;var dx=e.touches[0].clientX-stx,dy=e.touches[0].clientY-sty;
  if(Math.abs(dy)>Math.abs(dx)&&dx<10){swp=false;return;}
  if(dx<0)return;e.preventDefault();
  swpS.style.transition="none";swpP.style.transition="none";
  swpS.style.transform="translateX("+dx+"px)";
  swpP.style.transform="translateX("+(-20+dx/window.innerWidth*20)+"%)";
  swpP.style.opacity=.4+dx/window.innerWidth*.6;
},{passive:false});
mob.addEventListener("touchend",function(e){
  if(!swp||!swpS)return;swp=false;
  var dx=e.changedTouches[0].clientX-stx;
  swpS.style.transition="";swpP.style.transition="";
  if(dx>window.innerWidth*.25){
    swpS.style.transform="translateX(100%)";
    swpP.style.transform="";swpP.style.opacity="";
    swpP.classList.remove("exit");swpP.classList.add("active");
    mStack.pop();var s=swpS;setTimeout(function(){if(s.parentNode)s.remove();},350);
  }else{
    swpS.style.transform="";swpP.style.transform="";swpP.style.opacity="";
  }
  swpS=swpP=null;
},{passive:true});

})();
</script></body></html>
