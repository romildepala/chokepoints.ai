<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Compute Value Chain — Atlas (canonical)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500..700&family=Spline+Sans:wght@400;500;600;700&family=Spline+Sans+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
:root{--bg:#0e1116;--panel:#161b22;--ink:#e8edf4;--mut:#9aa6b4;--line:#2a313c;--accent:#54c3f1}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Spline Sans',system-ui,sans-serif;overflow:hidden}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
header{padding:11px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:linear-gradient(180deg,#11161d,#0e1116)}
header h1{font-family:'Fraunces',serif;font-size:19px;font-weight:600;margin:0;white-space:nowrap}
header .sub{color:var(--mut);font-size:12px;max-width:560px;line-height:1.35}
.spacer{flex:1}
#search{background:#0c1014;border:1px solid var(--line);color:var(--ink);border-radius:9px;padding:8px 12px;font:13px 'Spline Sans';width:220px;outline:none}
#search:focus{border-color:var(--accent)}
.btn{background:#1b222c;border:1px solid var(--line);color:var(--ink);border-radius:9px;padding:7px 11px;font:13px 'Spline Sans';cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:#fff}
#toolbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:8px 18px;border-bottom:1px solid var(--line);background:#11161d}
.tabs{display:flex;gap:4px;background:#0c1014;border:1px solid var(--line);border-radius:10px;padding:3px}
.tab{padding:6px 12px;border-radius:8px;font:600 12.5px 'Spline Sans';cursor:pointer;color:var(--mut)}
.tab.active{background:#23303f;color:#fff}
#toolbar select{background:#0c1014;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:6px 8px;font:12px 'Spline Sans';outline:none}
.depth{display:flex;gap:3px;background:#0c1014;border:1px solid var(--line);border-radius:8px;padding:3px}
.depth span{padding:5px 9px;border-radius:6px;font:600 11.5px 'Spline Sans';cursor:pointer;color:var(--mut)}
.depth span.on{background:#23303f;color:#fff}
.tgl{display:flex;align-items:center;gap:5px;font:12px 'Spline Sans';cursor:pointer;user-select:none}
.note{color:var(--mut);font-size:11px;margin-left:auto;max-width:560px;text-align:right}
#main{flex:1;position:relative;overflow:hidden}
svg{width:100%;height:100%;display:block;cursor:grab}svg.grabbing{cursor:grabbing}
.vizlayer{position:absolute;inset:0;width:100%;height:100%}
.link{fill:none;stroke:#39424f;stroke-width:1}
.link.hier{stroke:#222932;stroke-opacity:.45}
.link.cat{stroke:#6f7c8c;stroke-opacity:.55;stroke-width:1.5}
.link.leaf{stroke:#4a5563;stroke-opacity:.28;stroke-width:.9}
.link.hl{stroke-opacity:1;stroke-width:2.2;stroke:#54c3f1}
.node circle.core{stroke:#0e1116;stroke-width:1.2;cursor:pointer}
.node text{font:10.5px 'Spline Sans';fill:var(--ink);pointer-events:none;paint-order:stroke;stroke:#0e1116;stroke-width:3px;stroke-linejoin:round}
.node.anchor text{font-weight:700;font-size:13px}
.ring{fill:none;stroke:#ff4d57;stroke-width:2}
.dim{opacity:.1}

.stagelab{font:700 12px 'Spline Sans';letter-spacing:.4px}
#tip{position:absolute;pointer-events:none;background:rgba(10,14,20,.96);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:12px 'Spline Sans';color:var(--ink);z-index:20;display:none;max-width:260px;box-shadow:0 6px 24px rgba(0,0,0,.5)}
#tip b{color:#cfe8ff}
#legend{position:absolute;left:14px;bottom:14px;background:rgba(16,20,26,.9);border:1px solid var(--line);border-radius:12px;padding:11px 13px;max-width:250px;backdrop-filter:blur(6px);z-index:4;max-height:70%;overflow:auto}
#legend .lt{font:600 10.5px 'Spline Sans';letter-spacing:.6px;color:var(--mut);text-transform:uppercase;margin-bottom:7px}
#legend .row{display:flex;align-items:center;gap:8px;font-size:11.5px;padding:2px 0;cursor:pointer;color:#cfd6df}
#legend .row.off{opacity:.32}
#legend .sw{width:11px;height:11px;border-radius:3px;flex:none}
#legend .note{font-size:10px;color:var(--mut);margin-top:7px;line-height:1.4}
.gradbar{height:9px;border-radius:5px;margin:5px 0}
#panel{position:absolute;top:0;right:0;height:100%;width:380px;background:var(--panel);border-left:1px solid var(--line);transform:translateX(100%);transition:transform .25s;overflow-y:auto;padding:20px;z-index:6}
#panel.open{transform:none}
#panel h2{font-family:'Fraunces',serif;font-size:20px;margin:.1em 0 .15em}
#panel .lay{font:600 11px 'Spline Sans';letter-spacing:1px;text-transform:uppercase}
#panel .chip{display:inline-block;font:600 10.5px 'Spline Sans';padding:3px 8px;border-radius:20px;margin:2px 4px 2px 0}
#panel p{font-size:13px;line-height:1.5;color:#cdd5df}
#panel .sec{font:600 10.5px 'Spline Sans';letter-spacing:1px;text-transform:uppercase;color:var(--mut);margin:15px 0 6px;border-top:1px solid var(--line);padding-top:11px}
#panel .metrics{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:11px 0 2px}
#panel .metrics span{background:#0f141b;border:1px solid var(--line);border-radius:9px;padding:6px 9px;display:flex;flex-direction:column}
#panel .metrics b{font:600 14px 'Spline Sans Mono';color:#fff}
#panel .metrics i{font-style:normal;font-size:9.5px;letter-spacing:.4px;color:var(--mut);text-transform:uppercase;margin-top:2px}
#panel .dep{display:block;font-size:12.5px;padding:3px 7px;border-radius:7px;cursor:pointer;color:#dbe2ea}
#panel .dep:hover{background:#222a34}
#panel .ld{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;vertical-align:middle}
#panel .co{font-size:12px;padding:5px 7px;border-bottom:1px solid #1c222c}

#panel .co a{color:#7fb8e6;text-decoration:none}
#panel .co .m{color:var(--mut);font-size:10.5px}
#panel .close{position:absolute;top:13px;right:14px;cursor:pointer;color:var(--mut);font-size:20px}
.barwrap{margin-top:6px}
.bar{height:7px;border-radius:4px;display:inline-block}
@media(max-width:820px){#panel{width:100%}header .sub{display:none}}
</style></head><body><div id="app">

<div id="main">

</div>

  if(n.parent&&BY[n.parent])h+=`<div class="sec">Parent</div><span class="dep" data-id="${n.parent}">↩ ${esc(BY[n.parent].name)}</span>`;
  h+=`<div class="sec">Companies</div><p style="color:#6b7688;font-size:11.5px">${n.roll.toLocaleString()} companies mapped to this branch — the full roster with ownership, HQ &amp; provenance lives in the premium build.</p>`;
  pBody.innerHTML=h;panel.classList.add("open");
  pBody.querySelectorAll(".dep").forEach(el=>el.onclick=()=>{const t=BY[el.dataset.id];if(t){locked=true;hover(t);openPanel(t);focusNode(t);}});
}

// ---- legend ----
const legend=document.getElementById("legend");
function buildLegend(){
  let h=`<div class="lt">Layers — click to toggle</div>`;
  DATA.layerOrder.forEach(L=>{h+=`<div class="row" data-l="${L}"><span class="sw" style="background:${LAY[L].color}"></span>${esc(LAY[L].name)}</div>`;});
  h+=`<div id="grad"></div><div class="note">○ red ring = bottleneck / choke point · node size ∝ companies · drag to pan, scroll to zoom</div>`;
  legend.innerHTML=h;
  legend.querySelectorAll(".row").forEach(r=>r.onclick=()=>{const L=r.dataset.l;if(off.has(L)){off.delete(L);r.classList.remove("off");}else{off.add(L);r.classList.add("off");}refresh();if(view!=="map")setView(view);});
  setGrad();
}
function setGrad(){const g=document.getElementById("grad");if(!g)return;
  const ramps={score:["1","2","3","4","5"].map(k=>SC[k]),vc:Object.values(VC),crit:[CRIT[0],CRIT[1],CRIT[2],CRIT[3]],mkt:Object.values(MKT),mat:Object.values(MAT),ai:Object.values(AI),angle:Object.values(ANG)};
  const labels={score:["score 1","5"],vc:["value capture: low","high"],crit:["commoditised","choke"],mkt:["fragmented","monopoly"],mat:["emerging","legacy"],ai:["AI: high","low"],angle:["investment angle",""]};
  if((view==="map"||view==="wheel")&&ramps[colorBy]){const cs=ramps[colorBy].join(",");
    g.innerHTML=`<div class="lt" style="margin-top:9px;border-top:1px solid var(--line);padding-top:8px">${({score:'investment score',vc:'value capture',crit:'criticality',mkt:'market structure',mat:'maturity',ai:'AI potential',angle:'investment angle'})[colorBy]}</div><div class="gradbar" style="background:linear-gradient(90deg,${cs})"></div><div style="display:flex;justify-content:space-between;font-size:10px;color:var(--mut)"><span>${labels[colorBy][0]}</span><span>${labels[colorBy][1]}</span></div>`;
  } else g.innerHTML="";
}

// ---- views ----
function setView(v){view=v;document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active",t.dataset.v===v));
  const map=v==="map";
  svg.style("display",map?null:"none");
  document.getElementById("msvg").style.display=v==="matrix"?"":"none";
  document.getElementById("tsvg").style.display=v==="tree"?"":"none";
  document.getElementById("wsvg").style.display=v==="wheel"?"":"none";
  document.getElementById("lensWrap").style.display=(map||v==="wheel")?"":"none";
  document.getElementById("depth").style.display=map?"":"none";
  document.getElementById("vizNote").textContent=v==="matrix"?"scored nodes only · x = companies (log) · y = investment score · bubble = companies · colour = angle · red ring = choke"
    :v==="tree"?"populated nodes · area = companies · grouped by layer · colour = investment score"
    :v==="wheel"?"radius = how far downstream (core = raw materials → rim = applications) · right = silicon stream, left = power stream, converging at the data-centre ring · hover to trace inward"
    :"hover to trace dependencies · red ring = choke · depth filters the hierarchy";
  setGrad(); if(v==="matrix")renderMatrix(); if(v==="tree")renderTree(); if(v==="wheel")renderWheel();
}
function renderMatrix(){const W2=main().clientWidth,H2=main().clientHeight,s=d3.select("#msvg").attr("viewBox",`0 0 ${W2} ${H2}`);s.selectAll("*").remove();

  const rS=d3.scaleSqrt().domain([1,1500]).range([3,34]);
  const g=s.append("g");
  [1,10,100,1000].forEach(v=>g.append("line").attr("x1",x(v)).attr("x2",x(v)).attr("y1",T).attr("y2",H2-B).attr("stroke","#1b212b"));
  [1,2,3,4,5].forEach(v=>g.append("line").attr("x1",L).attr("x2",W2-R).attr("y1",y(v)).attr("y2",y(v)).attr("stroke","#1b212b"));
  g.append("line").attr("stroke","#39424f").attr("stroke-dasharray","3,5").attr("x1",L).attr("x2",W2-R).attr("y1",y(2.5)).attr("y2",y(2.5));
  g.append("line").attr("stroke","#39424f").attr("stroke-dasharray","3,5").attr("x1",x(30)).attr("x2",x(30)).attr("y1",T).attr("y2",H2-B);
  g.append("text").attr("class","stagelab").attr("fill","#6b7688").attr("x",W2-R-6).attr("y",T+16).attr("text-anchor","end").style("font-size","11px").text("many players · high score — scale roll-up");
  g.append("text").attr("class","stagelab").attr("fill","#6b7688").attr("x",L+6).attr("y",T+16).style("font-size","11px").text("few players · high score — scarce / concentrated");
  [1,10,100,1000].forEach(v=>g.append("text").attr("fill","#8b9099").attr("x",x(v)).attr("y",H2-B+18).attr("text-anchor","middle").style("font","11px 'Spline Sans'").text(v));
  [1,2,3,4,5].forEach(v=>g.append("text").attr("fill","#8b9099").attr("x",L-10).attr("y",y(v)+4).attr("text-anchor","end").style("font","11px 'Spline Sans'").text(v));
  g.append("text").attr("fill","#9aa6b4").attr("x",(L+W2-R)/2).attr("y",H2-16).attr("text-anchor","middle").style("font","12px 'Spline Sans'").text("companies in node  (log — breadth / fragmentation)");
  g.append("text").attr("fill","#9aa6b4").attr("transform",`translate(${L-46},${(T+H2-B)/2}) rotate(-90)`).attr("text-anchor","middle").style("font","12px 'Spline Sans'").text("investment score");
  const data=N.filter(n=>n.score!=null&&n.roll>0&&!off.has(n.layer)&&(!chokeOnly||n.critLvl>=2)).sort((a,b)=>b.roll-a.roll);
  const jit=id=>((id.split("").reduce((a,c)=>a+c.charCodeAt(0),0)%100)/100-0.5)*0.34;
  const b=g.selectAll("g.b").data(data).enter().append("g").style("cursor","pointer")
    .attr("transform",n=>`translate(${x(n.roll)},${y(n.score+jit(n.id))})`)
    .on("mousemove",(e,n)=>showTip(e,n)).on("mouseleave",hideTip).on("click",(e,n)=>{hideTip();openPanel(n);});
  b.filter(n=>n.critLvl>=2).append("circle").attr("r",n=>rS(n.roll)+3).attr("fill","none").attr("stroke","#ff4d57").attr("stroke-width",1.5);
  b.append("circle").attr("r",n=>rS(n.roll)).attr("fill",n=>ANG[n.angle]||LAY[n.layer].color).attr("fill-opacity",.82).attr("stroke","#0e1116");
  b.filter(n=>n.roll>=120||n.score>=5).append("text").attr("y",4)
    .attr("x",n=>x(n.roll)>(W2-R-150)?-(rS(n.roll)+4):(rS(n.roll)+4)).attr("text-anchor",n=>x(n.roll)>(W2-R-150)?"end":"start")
    .style("font","10.5px 'Spline Sans'").attr("fill","#dbe2ea").style("paint-order","stroke").style("stroke","#0e1116").style("stroke-width","3px").style("pointer-events","none").text(n=>n.name.length>34?n.name.slice(0,32)+"…":n.name);
}
function renderTree(){const W2=main().clientWidth,H2=main().clientHeight,el=document.getElementById("tsvg");el.innerHTML="";
  const s=d3.select(el).append("svg").attr("width","100%").attr("height","100%").attr("viewBox",`0 0 ${W2} ${H2}`);
  const data=N.filter(n=>n.n>0&&!off.has(n.layer)&&(!chokeOnly||n.critLvl>=2)&&(!scoredOnly||n.score!=null));
  const byD={};data.forEach(n=>{(byD[n.layer]=byD[n.layer]||[]).push(n);});
  const root=d3.hierarchy({children:DATA.layerOrder.filter(L=>byD[L]).map(L=>({L,children:byD[L].map(n=>({value:n.n||n.roll,ref:n}))}))}).sum(d=>d.value).sort((a,b)=>b.value-a.value);
  d3.treemap().size([W2,H2]).paddingInner(1).paddingTop(16).round(true)(root);
  const lf=s.selectAll("g").data(root.leaves()).enter().append("g").attr("transform",d=>`translate(${d.x0},${d.y0})`).style("cursor","pointer")
    .on("mousemove",(e,d)=>showTip(e,d.data.ref)).on("mouseleave",hideTip).on("click",(e,d)=>{hideTip();openPanel(d.data.ref);});
  lf.append("rect").attr("width",d=>Math.max(0,d.x1-d.x0)).attr("height",d=>Math.max(0,d.y1-d.y0))
    .attr("fill",d=>d.data.ref.score?SC[d.data.ref.score]:LAY[d.data.ref.layer].color).attr("fill-opacity",d=>d.data.ref.score?0.92:0.5)
    .attr("stroke",d=>d.data.ref.critLvl>=2?"#ff4d57":"#0e1116").attr("stroke-width",d=>d.data.ref.critLvl>=2?1.3:0.5);
  lf.filter(d=>(d.x1-d.x0)>54&&(d.y1-d.y0)>22).append("text").attr("x",5).attr("y",14).style("font","600 11px 'Spline Sans'").attr("fill","#fff").style("paint-order","stroke").style("stroke","rgba(0,0,0,.4)").style("stroke-width","2px").style("pointer-events","none")
    .text(d=>{const w=d.x1-d.x0,m=Math.floor(w/6.4),x=d.data.ref.name;return x.length>m?x.slice(0,Math.max(2,m-1))+"…":x;});
  lf.filter(d=>(d.x1-d.x0)>54&&(d.y1-d.y0)>34).append("text").attr("x",5).attr("y",28).style("font","10px 'Spline Sans Mono'").attr("fill","rgba(255,255,255,.85)").style("pointer-events","none").text(d=>d.data.ref.n+" cos");
  s.selectAll("text.dl").data(root.children).enter().append("text").attr("x",d=>d.x0+5).attr("y",d=>d.y0+12).style("font","700 11px 'Spline Sans'").attr("fill","rgba(255,255,255,.9)").style("paint-order","stroke").style("stroke","rgba(0,0,0,.45)").style("stroke-width","2.5px").style("pointer-events","none").text(d=>LAY[d.data.L].name.toUpperCase());
}
function renderWheel(){
  const host=main(),W2=host.clientWidth,H2=host.clientHeight;
  const s=d3.select("#wsvg").attr("viewBox",`0 0 ${W2} ${H2}`);s.selectAll("*").remove();
  const cx=W2/2,cy=H2/2,RMAX=Math.min(W2,H2)/2-26;
  const wrap=s.append("g");const g=wrap.append("g").attr("transform",`translate(${cx},${cy})`);
  const dep={};function D(L){if(dep[L]!=null)return dep[L];const u=(LU[L]||[]).filter(x=>LAY[x]);dep[L]=u.length?1+Math.max.apply(null,u.map(D)):0;return dep[L];}
  Object.keys(LAY).forEach(D);const maxD=Math.max.apply(null,Object.values(dep));dep["LX"]=maxD+1;
  const TAU=Math.PI*2,PI=Math.PI;
  const ANG={L0:[0,TAU],L3:[0,TAU],L6:[0,TAU],L7:[0,TAU],L8:[0,TAU],LX:[0,TAU],L5:[0,PI],L4:[0,PI],L1:[PI,TAU],L2:[PI,TAU]};
  const cnt={};N.forEach(n=>cnt[n.layer]=(cnt[n.layer]||0)+1);
  const depths=[...new Set(Object.values(dep))].sort((a,b)=>a-b);
  const wt={};depths.forEach(d=>{const ls=Object.keys(dep).filter(L=>dep[L]===d);wt[d]=Math.sqrt(Math.max.apply(null,ls.map(L=>cnt[L]||1)))+1.3;});
  const totW=depths.reduce((a,d)=>a+wt[d],0);let acc=0;const bandR={};depths.forEach(d=>{const r0=RMAX*acc/totW;acc+=wt[d];bandR[d]=[r0,RMAX*acc/totW];});
  const REG={};Object.keys(LAY).forEach(L=>{const d=dep[L];const a=ANG[L]||[0,TAU];REG[L]={r0:bandR[d][0],r1:bandR[d][1],a0:a[0],a1:a[1]};});
  const arc=d3.arc();
  DATA.layerOrder.forEach(L=>{const r=REG[L];g.append("path").attr("d",arc({innerRadius:r.r0+1,outerRadius:r.r1-1,startAngle:r.a0,endAngle:r.a1})).attr("fill",LAY[L].color).attr("fill-opacity",.1).attr("stroke",LAY[L].color).attr("stroke-opacity",.25);});
  Object.keys(LU).forEach(L=>{(LU[L]||[]).forEach(U=>{const A=REG[L],B=REG[U];if(!A||!B)return;const ma=(A.a0+A.a1)/2,mb=(B.a0+B.a1)/2,ra=A.r0,rb=B.r1;const x1=Math.sin(ma)*ra,y1=-Math.cos(ma)*ra,x2=Math.sin(mb)*rb,y2=-Math.cos(mb)*rb;g.append("path").attr("class","wdep").attr("d",`M${x1},${y1} Q0,0 ${x2},${y2}`).attr("fill","none").attr("stroke","#5b6573").attr("stroke-opacity",.35).attr("stroke-width",1.4).attr("data-s",U).attr("data-t",L);});});
  const visN=N.filter(n=>!off.has(n.layer)&&(!chokeOnly||n.critLvl>=2)&&(!scoredOnly||n.score!=null));
  const byL={};visN.forEach(n=>{(byL[n.layer]=byL[n.layer]||[]).push(n);});
  const idk=id=>id.split(".").map(p=>p.replace("L","").padStart(3,"0")).join(".");
  const dots=[];
  Object.keys(byL).forEach(L=>{const reg=REG[L];const arr=byL[L].slice().sort((a,b)=>idk(a.id)<idk(b.id)?-1:1);
    const pad=5,rr0=reg.r0+pad,rr1=reg.r1-pad,span=reg.a1-reg.a0,midR=(rr0+rr1)/2;
    let rows=Math.max(1,Math.round((rr1-rr0)/11));rows=Math.min(rows,Math.max(1,Math.ceil(arr.length/Math.max(3,(span*midR)/15))));rows=Math.max(1,rows);
    const perRow=Math.ceil(arr.length/rows),rowGap=(rr1-rr0)/rows;
    arr.forEach((n,i)=>{const row=i%rows,col=Math.floor(i/rows);const ang=reg.a0+span*((col+0.5)/perRow);const rad=rr0+rowGap*(row+0.5);n._wx=Math.sin(ang)*rad;n._wy=-Math.cos(ang)*rad;dots.push(n);});});
  const ds=d3.scaleSqrt().domain([1,1500]).range([1.6,7]);
  const ng=g.selectAll("g.wn").data(dots,n=>n.id).enter().append("g").attr("transform",n=>`translate(${n._wx},${n._wy})`).style("cursor","pointer")
    .on("mouseenter",(e,n)=>{whover(n);showTip(e,n);}).on("mousemove",moveTip).on("mouseleave",()=>{hideTip();if(!locked)wclear();})
    .on("click",(e,n)=>{e.stopPropagation();locked=true;whover(n);openPanel(n);});
  ng.filter(n=>n.critLvl>=2).append("circle").attr("r",n=>ds(n.roll)+1.8).attr("fill","none").attr("stroke","#ff4d57").attr("stroke-width",1.1);
  ng.append("circle").attr("r",n=>ds(n.roll)).attr("fill",nFill).attr("stroke","#0e1116").attr("stroke-width",.6);
  function labAng(L){const a=ANG[L]||[0,TAU];if(a[1]-a[0]>=TAU-0.01)return PI;return (a[0]+a[1])/2;}
  DATA.layerOrder.forEach(L=>{const r=REG[L];const ma=labAng(L),rad=(r.r0+r.r1)/2;const x=Math.sin(ma)*rad,y=-Math.cos(ma)*rad;
    g.append("text").attr("x",x).attr("y",y).attr("text-anchor","middle").attr("dy",".35em").style("font","700 11.5px 'Spline Sans'").attr("fill",LAY[L].color).style("paint-order","stroke").style("stroke","#0e1116").style("stroke-width","3.5px").style("pointer-events","none").text(L);});
  const anchor=(x,y,t,al)=>g.append("text").attr("x",x).attr("y",y).attr("text-anchor",al||"middle").attr("dy",".35em").style("font","700 9.5px 'Spline Sans'").attr("fill","#7d899a").style("letter-spacing",".6px").style("paint-order","stroke").style("stroke","#0e1116").style("stroke-width","3px").style("pointer-events","none").text(t);
  g.append("circle").attr("r",5).attr("fill","#cfd6df");
  anchor(0,16,"RAW MATERIALS");
  anchor(RMAX*0.99,0,"SILICON ▸","end");
  anchor(-RMAX*0.99,0,"◂ POWER","start");
  anchor(0,-RMAX*0.985,"OUTWARD → DOWNSTREAM");
  function whover(n){const a=anc(n.id),d=desc(n.id),keep=new Set([n.id,...a,...d]);
    ng.style("opacity",x=>keep.has(x.id)?1:.12);
    g.selectAll("path.wdep").each(function(){const ss=this.getAttribute("data-s"),tt=this.getAttribute("data-t"),on=keep.has(ss)&&keep.has(tt);this.setAttribute("stroke",on?"#54c3f1":"#5b6573");this.setAttribute("stroke-opacity",on?1:.12);this.setAttribute("stroke-width",on?2.4:1.4);});}
  function wclear(){ng.style("opacity",1);g.selectAll("path.wdep").attr("stroke","#5b6573").attr("stroke-opacity",.35).attr("stroke-width",1.4);}
  const wz=d3.zoom().scaleExtent([0.5,6]).on("zoom",ev=>wrap.attr("transform",ev.transform));s.call(wz);
  s.on("click",()=>{locked=false;wclear();closePanel();});
}
